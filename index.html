<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Codes</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: sans-serif;
  }
  #entry {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  #entry p {
    color: #fff;
    font-size: 20px;
  }
  #codeInput {
    padding: 10px 14px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    width: 260px;
    text-align: center;
  }
  #go {
    padding: 10px 20px;
    font-size: 16px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
  }
  #display {
    display: none;
    width: 100%;
    height: 100%;
  }
  #display img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
</style>
</head>
<body>

  <div id="entry">
    <p>What code do you need?</p>
    <input type="text" id="codeInput" placeholder="Enter code">
    <button id="go">Go</button>
  </div>

  <div id="display">
    <img id="slideshow" src="" alt="result">
  </div>

  <script>
    const image1 = "https://cdn.phototourl.com/free/2026-09-13-0ac345ed-85ce-4cb1-903e-499357e87dc2.webp";
    const image2 = "https://cdn.phototourl.com/free/2026-09-14-baa52b79-5c0a-4bcd-90c0-b47dd0c62da2.jpg";
    const image3 = "https://cdn.phototourl.com/free/2026-09-14-3faaeae2-0dbe-403a-80be-fe04bd833a16.jpg";
    const image4 = "https://cdn.phototourl.com/free/2026-09-14-c2988045-1623-4003-9b3f-0d163d611684.jpg";

    let interval;

    function showSlideshow(images) {
      document.getElementById("entry").style.display = "none";
      document.getElementById("display").style.display = "block";
      const img = document.getElementById("slideshow");
      let i = 0;
      img.src = images[i];
      if (images.length > 1) {
        interval = setInterval(() => {
          i = (i + 1) % images.length;
          img.src = images[i];
        }, 1000);
      }
    }

    document.getElementById("go").addEventListener("click", handleSubmit);
    document.getElementById("codeInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSubmit();
    });

    function handleSubmit() {
      const val = document.getElementById("codeInput").value.trim().toLowerCase();
      if (!val) return;

      if (val === "daddy") {
        showSlideshow([image4]);
      } else if (val.includes("prime") || val.includes("rick")) {
        showSlideshow([image1]);
      } else {
        showSlideshow([image2, image3]);
      }
    }
  </script>
</body>
</html>
